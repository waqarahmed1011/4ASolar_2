<!DOCTYPE html>
<html>
<head><title>Netlify Form Detection</title></head>
<body>
<!-- This file exists solely for Netlify's build-time form schema detection. It is never shown to users. -->
<form name="contact" data-netlify="true" hidden>
  <input type="text" name="first-name" />
  <input type="text" name="last-name" />
  <input type="email" name="email" />
  <input type="tel" name="phone" />
  <select name="service">
    <option value="Residential Solar">Residential Solar</option>
    <option value="Commercial Solar">Commercial Solar</option>
    <option value="Solar for Non-Profits">Solar for Non-Profits</option>
    <option value="Battery Storage Systems">Battery Storage Systems</option>
    <option value="EV Charger Installation">EV Charger Installation</option>
    <option value="Service &amp; Repairs">Service &amp; Repairs</option>
    <option value="Solar Incentives Inquiry">Solar Incentives Inquiry</option>
  </select>
  <input type="text" name="address" />
  <input type="text" name="city" />
  <input type="text" name="state" />
  <input type="text" name="zip" />
  <textarea name="notes"></textarea>
  <button type="submit">Schedule</button>
</form>
</body>
</html>
